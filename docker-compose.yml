
services:

  postgres-db:
    image: postgres:15-alpine
    container_name: Entrega1_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - siga-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ${BACKEND_IMAGE:-siga-backend:local}
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: Entrega1_backend
    restart: unless-stopped

    environment:
      DB_URL: jdbc:postgresql://postgres-db:5432/${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DDL_AUTO: update
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI}
      KEYCLOAK_JWK_SET_URI: ${KEYCLOAK_JWK_SET_URI}
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
      KEYCLOAK_INTERNAL_URL: ${KEYCLOAK_INTERNAL_URL}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
      SIGA_LOCAL_FICTITIOUS_PASSWORDS: ${SIGA_LOCAL_FICTITIOUS_PASSWORDS:-false}
      KEYCLOAK_VALIDATE_AUDIENCE: ${KEYCLOAK_VALIDATE_AUDIENCE:-false}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-siga-backend}
      
    ports:
      - "8080:8080"

    depends_on:
      postgres-db:
        condition: service_healthy

    networks:
      - siga-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    container_name: Entrega1_keycloak
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
    command: start-dev
    volumes:
      - keycloak_data:/opt/keycloak/data
    networks:
      - siga-network

  frontend:
    image: ${FRONTEND_IMAGE:-siga-frontend:local}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080/api}
        VITE_KEYCLOAK_URL: ${VITE_KEYCLOAK_URL:-http://localhost:8081}
        VITE_KEYCLOAK_REALM: ${VITE_KEYCLOAK_REALM:-SIGA}
        VITE_KEYCLOAK_CLIENT_ID: ${VITE_KEYCLOAK_CLIENT_ID:-siga-frontend}
    container_name: Entrega1_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    networks:
      - siga-network

volumes:
  postgres_data:
  keycloak_data:

networks:
  siga-network:
    driver: bridge
