# Use together with docker-compose.cloud.yml after installing the TLS certificate.
services:
  nginx:
    ports:
      - '443:443'
    volumes:
      - ./deploy/nginx/https.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/tls:/etc/nginx/tls:ro
    healthcheck:
      test: ['CMD', 'wget', '--no-check-certificate', '-q', '-O', '/dev/null', 'https://127.0.0.1/health']
