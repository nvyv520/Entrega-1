spring.datasource.url=jdbc:h2:mem:siga-test;MODE=PostgreSQL;NON_KEYWORDS=YEAR;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost/realms/test
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost/realms/test/certs
KEYCLOAK_INTERNAL_URL=http://localhost
KEYCLOAK_ADMIN_CLIENT_ID=test-client
KEYCLOAK_ADMIN_CLIENT_SECRET=test-secret
siga.keycloak.local-fictitious-passwords=false
