name: siga-cloud

services:
  postgres-db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME}
      POSTGRES_USER: ${DB_USER:?Set DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/10-keycloak.sql:/docker-entrypoint-initdb.d/10-keycloak.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - siga-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    restart: unless-stopped
    command: ['start', '--import-realm']
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-db:5432/${DB_NAME:?Set DB_NAME}
      KC_DB_SCHEMA: keycloak
      KC_DB_USERNAME: ${DB_USER:?Set DB_USER}
      KC_DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:?Set KC_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?Set KC_ADMIN_PASSWORD}
      KC_HOSTNAME: ${PUBLIC_URL:?Set PUBLIC_URL}/auth
      KC_HTTP_ENABLED: 'true'
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HTTP_MANAGEMENT_RELATIVE_PATH: /
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: 'true'
    volumes:
      - ./deploy/keycloak/import:/opt/keycloak/data/import:ro
      - ./deploy/healthcheck-http.sh:/opt/siga/healthcheck-http.sh:ro
    healthcheck:
      test: ['CMD', 'bash', '/opt/siga/healthcheck-http.sh', '9000', '/health/ready']
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 15
    depends_on:
      postgres-db:
        condition: service_healthy
    networks:
      - siga-network

  # Docker Compose creates three instances of this service.
  backend:
    image: ${BACKEND_IMAGE:-nvyv520/siga-backend:latest}
    restart: unless-stopped
    deploy:
      replicas: 3
    environment:
      DB_URL: jdbc:postgresql://postgres-db:5432/${DB_NAME:?Set DB_NAME}
      DB_USER: ${DB_USER:?Set DB_USER}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      DDL_AUTO: ${DDL_AUTO:-validate}
      KEYCLOAK_ISSUER_URI: ${PUBLIC_URL:?Set PUBLIC_URL}/auth/realms/SIGA
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/auth/realms/SIGA/protocol/openid-connect/certs
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080/auth
      KEYCLOAK_ADMIN_CLIENT_ID: ${KEYCLOAK_ADMIN_CLIENT_ID:?Set KEYCLOAK_ADMIN_CLIENT_ID}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?Set KEYCLOAK_ADMIN_CLIENT_SECRET}
      KEYCLOAK_VALIDATE_AUDIENCE: ${KEYCLOAK_VALIDATE_AUDIENCE:-false}
      KEYCLOAK_AUDIENCE: siga-backend
      CORS_ALLOWED_ORIGINS: ${PUBLIC_URL:?Set PUBLIC_URL}
      SWAGGER_REDIRECT_URL: ${PUBLIC_URL:?Set PUBLIC_URL}/swagger-ui/oauth2-redirect.html
      FORWARD_HEADERS_STRATEGY: framework
      SIGA_LOCAL_FICTITIOUS_PASSWORDS: 'false'
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60
    expose:
      - '8080'
    volumes:
      - ./deploy/healthcheck-http.sh:/opt/siga/healthcheck-http.sh:ro
    healthcheck:
      test: ['CMD', 'bash', '/opt/siga/healthcheck-http.sh', '8080', '/v3/api-docs']
      interval: 15s
      timeout: 10s
      start_period: 90s
      retries: 10
    networks:
      - siga-network
    depends_on:
      postgres-db:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  frontend:
    image: ${FRONTEND_IMAGE:-nvyv520/siga-frontend:latest}
    restart: unless-stopped
    expose:
      - '80'
    networks:
      - siga-network

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/upstream.conf:/etc/nginx/siga-upstream.conf:ro
      - ./deploy/nginx/routes.conf:/etc/nginx/siga-routes.conf:ro
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/health']
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - siga-network

volumes:
  postgres_data:

networks:
  siga-network:
    driver: bridge
