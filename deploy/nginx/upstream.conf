resolver 127.0.0.11 valid=10s ipv6=off;

map $http_host $forwarded_port {
    default $server_port;
    ~:(?<explicit_port>[0-9]+)$ $explicit_port;
}

# Docker DNS resolves backend to the three Compose replicas.
upstream siga_backend {
    zone siga_backend 64k;
    server backend:8080 resolve;
    keepalive 24;
}

