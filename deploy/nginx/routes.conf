    # Forward the public origin to Spring and Keycloak.
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $forwarded_port;
    proxy_set_header Connection "";

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://siga_backend;
        # Allows checking which replica served a request during the demonstration.
        add_header X-Backend $upstream_addr always;
    }

    location /v3/api-docs {
        proxy_pass http://siga_backend;
        add_header X-Backend $upstream_addr always;
    }

    location = /swagger-ui.html {
        proxy_pass http://siga_backend;
    }

    location /swagger-ui/ {
        proxy_pass http://siga_backend;
    }

    location = /auth {
        return 302 /auth/;
    }

    location /auth/ {
        # Keep the /auth prefix configured in Keycloak.
        set $keycloak keycloak:8080;
        proxy_pass http://$keycloak;
    }

    location / {
        set $frontend frontend:80;
        proxy_pass http://$frontend;
    }
